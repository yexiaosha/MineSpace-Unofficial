# Configuration file

worldgen {
    # Vanilla biome-decorator generators to replace with a no-op. GRANITE/DIORITE/ANDESITE are the stone patches, DIRT/GRAVEL the underground blobs, and COAL/IRON/GOLD/REDSTONE/DIAMOND/LAPIS the overworld ores (normally left to GT's own B:disableVanillaOres switch in gregtech.cfg). Valid names: GRANITE, DIORITE, ANDESITE, DIRT, GRAVEL, COAL, IRON, GOLD, REDSTONE, DIAMOND, LAPIS. [default: [GRANITE], [DIORITE], [ANDESITE]]
    S:disabledVanillaGenerators <
        GRANITE
        DIORITE
        ANDESITE
     >
}


