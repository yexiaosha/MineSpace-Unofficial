# Minespace - OpenAL configuration (see TJ-MIGRATION-PLAN.md 6ap)
#
# The client crashed on start-up with EXCEPTION_ACCESS_VIOLATION inside OpenAL64.dll, on the "Sound
# Library Loader" thread, before the main menu was reached. That DLL is the OpenAL Soft 1.15.1 that
# LWJGL 2.9.3 ships (2013, no version resource), and its DirectSound / WASAPI device path is the part
# that faults on this machine.
#
# This file is handed to the game by Play-Minespace.ps1 through the ALSOFT_CONF environment variable.
# It asks for the plain Windows waveOut backend and a 16-bit mixing format, which steps around the
# crashing path. If the game still crashes, change the last line of [general] to
#
#     drivers = null
#
# which disables audio output entirely - the game then starts with sound off. Replacing
# versions/1.12.2-forge-14.23.5.2859/natives/OpenAL64.dll with a current OpenAL Soft build (1.23.1 or
# newer) is the other way out, and the one that keeps modern audio backends.

[general]
drivers = winmm
sample-type = int16
period-size = 1024
