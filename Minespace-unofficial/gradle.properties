# Gradle
# 3G is required for the Minecraft decompile step; raise it if you have headroom.
# The HTTP timeouts are deliberately short: ForgeGradle's deobfuscating repo asks the remote
# maven for "<artifact>_mapped_<mappings>" coordinates that do not exist there. curse maven
# answers those with a very slow (sometimes hanging) response instead of a fast 404, which
# makes Gradle report "Read timed out" and abort the build instead of falling back to its own
# local deobf. A short timeout turns that into the fast 404 we want.
# Two network fixes, both learned the hard way on 2026-10-15 (TJ-MIGRATION-PLAN.md 6cm/6cq):
# this machine reaches the internet through a proxy configured in Windows, and a plain JVM does NOT
# use the system proxy settings unless it is told to. ForgeGradle fetches through its own
# URLConnection rather than Gradle's HTTP client, so without `useSystemProxies` those fetches are
# black-holed: the build sits in a socket read that never returns (an hour of it, twice). With it,
# the same build takes eleven seconds.
# The sun.net.* timeouts are the belt to that braces: URLConnection timeouts default to 0 (wait
# forever) for anything that still cannot be reached, so a dead remote fails instead of hanging -
# and on top of that, `org.gradle.internal.http.*` above only covers Gradle's own client.
org.gradle.jvmargs=-Xmx3G -Djava.net.useSystemProxies=true -Dorg.gradle.internal.http.connectionTimeout=15000 -Dorg.gradle.internal.http.socketTimeout=30000 -Dsun.net.client.defaultConnectTimeout=15000 -Dsun.net.client.defaultReadTimeout=15000
org.gradle.daemon=false

# Mod metadata, consumed by build.gradle and src/main/resources/mcmod.info
mod_id=minespace
mod_name=Minespace Unofficial
mod_version=0.2.0
mod_group=com.minespace.unofficial
mod_author=Minespace
# Shown in the in-game mod list. The "\\n" sequences are deliberate: the value is pasted
# into mcmod.info as a JSON string, where "\n" is a legal escape that comes out as a real
# line break. Keep the text ASCII - Minecraft's default font only covers Latin-1, so
# typographic quotes, arrows and bullet characters render as garbage in game.
mod_description=An unofficial addon that welds GregTech CE: TJ Edition to Galacticraft on Minecraft 1.12.2.\\n\\n* GregTech materials (desh_steel, meteoric_iron) that GregTech turns into ingots, dusts, plates, gears and fluids for you\\n* GregTech machines: the Oxygen Compressor, plus the Rocket Fuel Loader when Galacticraft is installed\\n* One GregTech stone type per celestial body - Galacticraft's Moon/Mars/Venus/asteroids and every Galaxy Space rock - plus the ore veins that generate on them\\n* An EU <-> gJ energy bridge so Galacticraft machines can run on GregTech power\\n\\nRequires GregTech CE: TJ Edition, Gregicality TJ Fork, Applied Energistics 2 UEL 0.55.6 and CodeChickenLib. Galacticraft itself is optional.

# ---------------------------------------------------------------------------
# Addon targets. Keep in sync with the `mods` configuration in build.gradle and
# with MOD-MANIFEST.md in the playable instance.
# ---------------------------------------------------------------------------
mc_version=1.12.2
forge_version=14.23.5.2859
# Migrating from GregTech CE: Unofficial (2.8.10-beta) to GregTech CE: TJ Edition.
# See TJ-MIGRATION-PLAN.md - M1 switches the compile target to the TJ stack.
gtcetj_version=1.18.3
gregicality_tjfork_version=0.26.3
galacticraft_version=4.0.7
codechickenlib_version=3.2.3.358

# Where the playable instance lives, relative to this project.
# `deployToInstance` copies the built addon jar into its mods/ folder so it can be
# tested in the real runtime. Relative so the repo works from any checkout path.
pack_dir=../Minespace-unofficial-dev
