# Gradle
# 3G is required for the Minecraft decompile step; raise it if you have headroom.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mod metadata, consumed by build.gradle and src/main/resources/mcmod.info
mod_id=minespace
mod_name=Minespace Unofficial
mod_version=0.2.0
mod_group=com.minespace.unofficial
mod_author=Minespace
# Shown in the in-game mod list. The "\\n" sequences are deliberate: the value is pasted
# into mcmod.info as a JSON string, where "\n" is a legal escape that comes out as a real
# line break. Keep the text ASCII - Minecraft's default font only covers Latin-1, so
# typographic quotes, arrows and bullet characters render as garbage in game.
mod_description=An unofficial addon that welds GregTech CE: Unofficial to Galacticraft on Minecraft 1.12.2.\\n\\n* GregTech materials (desh_steel, meteoric_iron) that GTCEu turns into ingots, dusts, plates, gears and fluids for you\\n* GregTech machines: the Oxygen Compressor, plus the Rocket Fuel Loader when Galacticraft is installed\\n* Moon, Mars, Venus and asteroid rocks, plus GT ore veins that actually generate on Galacticraft planets\\n* An EU <-> gJ energy bridge so Galacticraft machines can run on GregTech power\\n\\nRequires GregTech CE: Unofficial and CodeChickenLib. Galacticraft itself is optional.

# ---------------------------------------------------------------------------
# Addon targets. Keep in sync with the `mods` configuration in build.gradle and
# with MOD-MANIFEST.md in the playable instance.
# ---------------------------------------------------------------------------
mc_version=1.12.2
forge_version=14.23.5.2859
gtceu_version=2.8.10-beta
galacticraft_version=4.0.7
codechickenlib_version=3.2.3.358

# Where the playable instance lives, relative to this project.
# `deployToInstance` copies the built addon jar into its mods/ folder so it can be
# tested in the real runtime. Relative so the repo works from any checkout path.
pack_dir=../Minespace-unofficial-dev
